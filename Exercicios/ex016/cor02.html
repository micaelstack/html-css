<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradiente em CSS</title>
    <style>
       * { /*configuracoes globais das CSS */
            height: 100%;
        }
        body {
            background-image: linear-gradient(to right, #E24E60 10%, #CD2B86, #A0369E, #F98E1E, #F26444);
            background-attachment: fixed;
        }
    </style>
</head>
<body>
    <h1>Testando Gradiente</h1>
</body>
</html>
